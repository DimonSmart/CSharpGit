name: Ref navigation migration

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  DOTNET_NOLOGO: true

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run ref navigation migration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare Git test environment
        shell: pwsh
        run: |
          New-Item -ItemType File -Force (Join-Path $HOME ".gitconfig") | Out-Null
          git config --global core.autocrlf false

      - name: Apply change
        run: |
          python tools/apply-ref-navigation-change.py
          python tools/apply-ref-navigation-hotfix.py

      - name: Restore
        run: dotnet restore CSharpGit.slnx --property:Configuration=Release

      - name: Build
        run: dotnet build CSharpGit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpGit.slnx --configuration Release --no-build --verbosity minimal

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-ref-navigation-change.py tools/apply-ref-navigation-hotfix.py .github/workflows/ref-navigation-migration.yml
          git add -A
          git diff --cached --check
          git commit -m "Navigate refs in shared commit history"
          git push origin HEAD:main

      - name: Run cross-platform build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
