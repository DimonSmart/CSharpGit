name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare Git test environment
        shell: pwsh
        run: |
          New-Item -ItemType File -Force (Join-Path $HOME ".gitconfig") | Out-Null
          git config --global core.autocrlf false
          if ($IsMacOS) {
            # /var is a symlink to /private/var on macOS. Use a canonical temp root
            # so path assertions agree with paths returned by git rev-parse.
            "TMPDIR=/private/tmp/" >> $env:GITHUB_ENV
          }

      - name: Restore
        run: dotnet restore CSharpGit.slnx --property:Configuration=Release

      - name: Build
        run: dotnet build CSharpGit.slnx --configuration Release --no-restore

      - name: Test
        env:
          CSHARPGIT_TEST_METRICS: "1"
          CSHARPGIT_TEST_METRICS_DIR: ${{ github.workspace }}/TestDiagnostics
        run: dotnet test CSharpGit.slnx --configuration Release --no-build --verbosity minimal --logger "trx;LogFilePrefix=test-results"

      - name: Publish smoke and verify Core assemblies (Linux x64)
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "csharpgit-core-publish-smoke"
          dotnet publish src/CSharpGit.Presentation/CSharpGit.Presentation.csproj `
            --configuration Release `
            -f net10.0-desktop `
            -r linux-x64 `
            --self-contained false `
            -p:PublishTrimmed=false `
            --output $publishDir
          if ($LASTEXITCODE -ne 0) { throw "Desktop publish failed." }
          foreach ($name in @("CSharpGit", "CSharpGit.Infrastructure.Core", "CSharpGit.Presentation.Core")) {
            if (-not (Test-Path (Join-Path $publishDir "$name.dll") -PathType Leaf)) {
              throw "Published application is missing $name.dll."
            }
          }
          if (-not (Test-Path (Join-Path $publishDir "CSharpGit") -PathType Leaf)) {
            throw "Published application is missing the CSharpGit executable."
          }

      - name: Report test timings
        if: always()
        shell: pwsh
        run: |
          $python = if (Get-Command python3 -ErrorAction SilentlyContinue) { "python3" } else { "python" }
          & $python .github/scripts/report-test-timings.py --root tests --metrics TestDiagnostics

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            tests/**/TestResults/*.trx
            TestDiagnostics/*.jsonl
          if-no-files-found: warn
