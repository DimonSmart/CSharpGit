name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  PROJECT: src/CSharpGit.Presentation/CSharpGit.Presentation.csproj

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH format."
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare Git test environment
        shell: pwsh
        run: New-Item -ItemType File -Force (Join-Path $HOME ".gitconfig") | Out-Null

      - name: Restore
        run: dotnet restore CSharpGit.slnx --property:Configuration=Release

      - name: Build
        run: dotnet build CSharpGit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpGit.slnx --configuration Release --no-build --verbosity minimal

  package_required:
    name: Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            rid: win-x64
            kind: windows
          - label: macOS Apple Silicon
            os: macos-latest
            rid: osx-arm64
            kind: macos
          - label: macOS Intel
            os: macos-15-intel
            rid: osx-x64
            kind: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish, verify and package
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          PACKAGE_KIND: ${{ matrix.kind }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assemblyVersion = "$version.0"
          $publishDir = Join-Path $env:RUNNER_TEMP "publish-$env:RID"
          Remove-Item -Recurse -Force $publishDir -ErrorAction SilentlyContinue

          $common = @(
            "--configuration", "Release",
            "-f", "net10.0-desktop",
            "-r", $env:RID,
            "--self-contained", "true",
            "-p:TargetFrameworks=net10.0-desktop",
            "-p:PublishTrimmed=false",
            "-p:DebugType=None",
            "-p:DebugSymbols=false",
            "-p:IncludeSourceRevisionInInformationalVersion=false",
            "-p:Version=$version",
            "-p:AssemblyVersion=$assemblyVersion",
            "-p:FileVersion=$assemblyVersion",
            "-p:InformationalVersion=$version",
            "-p:ApplicationDisplayVersion=$version"
          )

          if ($env:PACKAGE_KIND -eq "windows") {
            $assetName = "CSharpGit-$env:GITHUB_REF_NAME-win-x64.zip"
            dotnet publish $env:PROJECT @common --output $publishDir `
              -p:UseMonoRuntime=false `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:IncludeAllContentForSelfExtract=true
            if ($LASTEXITCODE -ne 0) { throw "Windows publish failed." }

            $exe = Join-Path $publishDir "CSharpGit.exe"
            if (-not (Test-Path $exe -PathType Leaf) -or (Get-Item $exe).Length -le 0) {
              throw "Expected non-empty CSharpGit.exe."
            }
            if (Get-ChildItem $publishDir -Filter *.pdb -File -Recurse) {
              throw "Windows publish output contains .pdb files."
            }

            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
            if ($info.FileVersion -ne $assemblyVersion) {
              throw "FileVersion '$($info.FileVersion)' does not match '$assemblyVersion'."
            }
            if ($info.ProductVersion -ne $version) {
              throw "ProductVersion '$($info.ProductVersion)' does not match '$version'."
            }

            $assetPath = Join-Path $env:RUNNER_TEMP $assetName
            Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $assetPath -CompressionLevel Optimal -Force

            $extractDir = Join-Path $env:RUNNER_TEMP "verify-win-x64"
            Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
            Expand-Archive -Path $assetPath -DestinationPath $extractDir
            if (-not (Test-Path (Join-Path $extractDir "CSharpGit.exe") -PathType Leaf)) {
              throw "Packaged Windows artifact does not contain CSharpGit.exe."
            }
            if (Get-ChildItem $extractDir -Filter *.pdb -File -Recurse) {
              throw "Packaged Windows artifact contains .pdb files."
            }
          }
          else {
            $assetName = "CSharpGit-$env:GITHUB_REF_NAME-$env:RID-app.zip"
            dotnet publish $env:PROJECT @common `
              -p:PackageFormat=app `
              -p:UnoMacOSIncludeDebugSymbols=false
            if ($LASTEXITCODE -ne 0) { throw "macOS publish failed for $env:RID." }

            $appDir = Join-Path $env:GITHUB_WORKSPACE "src/CSharpGit.Presentation/bin/Release/net10.0-desktop/$env:RID/publish/CSharpGit.app"
            $plist = Join-Path $appDir "Contents/Info.plist"
            if (-not (Test-Path $plist -PathType Leaf)) {
              throw "Expected CSharpGit.app/Contents/Info.plist."
            }

            $bundleVersion = (& /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" $plist).Trim()
            if ($LASTEXITCODE -ne 0 -or $bundleVersion -ne $version) {
              throw "CFBundleShortVersionString '$bundleVersion' does not match '$version'."
            }

            $bundleExecutable = (& /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" $plist).Trim()
            $executable = Join-Path $appDir "Contents/MacOS/$bundleExecutable"
            if (-not (Test-Path $executable -PathType Leaf)) {
              throw "macOS bundle executable does not exist."
            }
            & /usr/bin/test -x $executable
            if ($LASTEXITCODE -ne 0) { throw "macOS bundle executable is not executable." }
            if (Get-ChildItem $appDir -Filter *.pdb -File -Recurse) {
              throw "macOS app contains .pdb files."
            }

            $assetPath = Join-Path $env:RUNNER_TEMP $assetName
            & /usr/bin/ditto -c -k --sequesterRsrc --keepParent $appDir $assetPath
            if ($LASTEXITCODE -ne 0) { throw "Failed to package macOS app." }

            $extractDir = Join-Path $env:RUNNER_TEMP "verify-$env:RID"
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            & /usr/bin/ditto -x -k $assetPath $extractDir
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $extractDir "CSharpGit.app/Contents/Info.plist") -PathType Leaf)) {
              throw "Packaged macOS artifact cannot be restored to a valid CSharpGit.app."
            }
          }

          if (-not (Test-Path $assetPath -PathType Leaf) -or (Get-Item $assetPath).Length -le 0) {
            throw "Release artifact was not created."
          }

          $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$assetPath.sha256"
          "$hash  $assetName" | Set-Content $checksumPath -Encoding ascii
          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV
          "CHECKSUM_PATH=$checksumPath" >> $env:GITHUB_ENV

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: checksum-${{ matrix.rid }}
          path: ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

      - name: Attest package
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ASSET_PATH }}

  package_linux:
    name: Package Linux x64 (best effort)
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish, verify and package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assemblyVersion = "$version.0"
          $publishDir = Join-Path $env:RUNNER_TEMP "publish-linux-x64"
          $assetName = "CSharpGit-$env:GITHUB_REF_NAME-linux-x64.tar.gz"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          dotnet publish $env:PROJECT `
            --configuration Release `
            -f net10.0-desktop `
            -r linux-x64 `
            --self-contained true `
            --output $publishDir `
            -p:TargetFrameworks=net10.0-desktop `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version `
            -p:ApplicationDisplayVersion=$version
          if ($LASTEXITCODE -ne 0) { throw "Linux publish failed." }

          $binary = Join-Path $publishDir "CSharpGit"
          if (-not (Test-Path $binary -PathType Leaf)) { throw "Expected CSharpGit executable." }
          chmod +x $binary
          & /usr/bin/test -x $binary
          if ($LASTEXITCODE -ne 0) { throw "Linux executable bit is not set." }
          if (Get-ChildItem $publishDir -Filter *.pdb -File -Recurse) {
            throw "Linux publish output contains .pdb files."
          }

          $managedAssembly = Join-Path $publishDir "CSharpGit.dll"
          if (-not (Test-Path $managedAssembly -PathType Leaf)) {
            throw "Expected CSharpGit.dll for metadata verification."
          }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($managedAssembly).Version.ToString() -ne $assemblyVersion) {
            throw "Linux AssemblyVersion does not match release version."
          }
          if ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($managedAssembly).ProductVersion -ne $version) {
            throw "Linux InformationalVersion does not match release version."
          }

          tar -czf $assetPath -C $publishDir .
          if ($LASTEXITCODE -ne 0) { throw "Failed to create Linux tar.gz." }
          tar -tzf $assetPath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Linux tar.gz verification failed." }

          $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$assetPath.sha256"
          "$hash  $assetName" | Set-Content $checksumPath -Encoding ascii
          "ASSET_PATH=$assetPath" >> $env:GITHUB_ENV
          "CHECKSUM_PATH=$checksumPath" >> $env:GITHUB_ENV

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-linux-x64
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@v7
        with:
          name: checksum-linux-x64
          path: ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

      - name: Attest package
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ASSET_PATH }}

  release:
    name: Create or update GitHub Release
    needs:
      - verify
      - package_required
      - package_linux
    if: ${{ always() && needs.verify.result == 'success' && needs.package_required.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/downloaded

      - name: Verify assets and create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP "downloaded"
          $assetsDir = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          function Find-One([string] $name) {
            $matches = @(Get-ChildItem $downloadDir -File -Recurse | Where-Object Name -eq $name)
            if ($matches.Count -ne 1) { throw "Expected exactly one '$name', found $($matches.Count)." }
            return $matches[0]
          }

          function Add-VerifiedAsset([string] $name, [bool] $required) {
            $assets = @(Get-ChildItem $downloadDir -File -Recurse | Where-Object Name -eq $name)
            $sums = @(Get-ChildItem $downloadDir -File -Recurse | Where-Object Name -eq "$name.sha256")
            if (-not $required -and $assets.Count -eq 0 -and $sums.Count -eq 0) { return $null }
            if ($assets.Count -ne 1 -or $sums.Count -ne 1) {
              if ($required) { throw "Missing or duplicate asset/checksum pair for '$name'." }
              Write-Warning "Linux artifact/checksum pair is incomplete; omitting Linux."
              return $null
            }

            $line = (Get-Content -Raw $sums[0].FullName).Trim()
            if ($line -notmatch '^(?<hash>[0-9a-fA-F]{64})\s+(?<file>.+)$' -or $Matches["file"] -ne $name) {
              if ($required) { throw "Invalid checksum fragment for '$name'." }
              Write-Warning "Linux checksum fragment is invalid; omitting Linux."
              return $null
            }

            $actual = (Get-FileHash $assets[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches["hash"].ToLowerInvariant()) {
              if ($required) { throw "SHA-256 mismatch for '$name'." }
              Write-Warning "Linux checksum mismatch; omitting Linux."
              return $null
            }

            Copy-Item $assets[0].FullName (Join-Path $assetsDir $name)
            return "$actual  $name"
          }

          $win = "CSharpGit-$env:GITHUB_REF_NAME-win-x64.zip"
          $arm = "CSharpGit-$env:GITHUB_REF_NAME-osx-arm64-app.zip"
          $intel = "CSharpGit-$env:GITHUB_REF_NAME-osx-x64-app.zip"
          $linux = "CSharpGit-$env:GITHUB_REF_NAME-linux-x64.tar.gz"

          $checksumLines = @(
            Add-VerifiedAsset $win $true
            Add-VerifiedAsset $arm $true
            Add-VerifiedAsset $intel $true
          )
          $linuxChecksum = Add-VerifiedAsset $linux $false
          $linuxPublished = $null -ne $linuxChecksum
          if ($linuxPublished) { $checksumLines += $linuxChecksum }

          $checksums = Join-Path $assetsDir "SHA256SUMS.txt"
          $checksumLines | Set-Content $checksums -Encoding ascii

          foreach ($line in Get-Content $checksums) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64})\s+(?<file>.+)$') {
              throw "Invalid SHA256SUMS.txt line: $line"
            }
            $actual = (Get-FileHash (Join-Path $assetsDir $Matches["file"]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches["hash"]) { throw "Final checksum verification failed for '$($Matches["file"])'." }
          }

          $tagPattern = '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$'
          $previous = git tag --merged $env:GITHUB_REF_NAME --list "v*.*.*" |
            ForEach-Object {
              if ($_ -match $tagPattern -and $_ -ne $env:GITHUB_REF_NAME) {
                [pscustomobject]@{ Tag = $_; Major = [int]$Matches["major"]; Minor = [int]$Matches["minor"]; Patch = [int]$Matches["patch"] }
              }
            } |
            Sort-Object Major, Minor, Patch |
            Select-Object -Last 1

          if ($previous) {
            $changesHeading = "### Changes since $($previous.Tag)"
            $changes = @(git log "$($previous.Tag)..$env:GITHUB_REF_NAME" --no-merges --pretty=format:"- %s (%h)")
          }
          else {
            $changesHeading = "### Changes"
            $changes = @(git log $env:GITHUB_REF_NAME --no-merges --pretty=format:"- %s (%h)")
          }
          if ($changes.Count -eq 0) { $changes = @("- No commit summary available.") }

          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          $notes = @(
            "## CSharpGit $env:GITHUB_REF_NAME",
            "",
            "### Download",
            "",
            "- Windows x64: [$win]($baseUrl/$win)",
            "- macOS Apple Silicon: [$arm]($baseUrl/$arm)",
            "- macOS Intel: [$intel]($baseUrl/$intel)"
          )
          if ($linuxPublished) {
            $notes += "- Linux x64: [$linux]($baseUrl/$linux)"
          }
          else {
            $notes += "- Linux x64: not published for this version (best-effort platform)."
          }
          $notes += @(
            "- SHA-256: [SHA256SUMS.txt]($baseUrl/SHA256SUMS.txt)",
            "",
            $changesHeading,
            ""
          )
          $notes += $changes
          $notes += @(
            "",
            "### Notes",
            "",
            "- CSharpGit requires `git` available through `PATH`.",
            "- The Windows x64 package is self-contained and does not require a separately installed .NET Runtime.",
            "- macOS builds are currently unsigned and not notarized. On first launch, use Finder → Open if Gatekeeper blocks the application.",
            "- Linux support is best effort and may require native/X11 dependencies."
          )

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes | Set-Content $notesPath -Encoding utf8

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "CSharpGit $env:GITHUB_REF_NAME" --notes-file $notesPath
          }
          else {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "CSharpGit $env:GITHUB_REF_NAME" --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to create or update GitHub Release." }

          Get-ChildItem $assetsDir -File | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload '$($_.Name)'." }
          }
