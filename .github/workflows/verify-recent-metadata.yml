name: Verify recent metadata

on:
  push:
    branches:
      - chatgpt/fix-recent-metadata-time

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Initialize Git global config
        run: touch ~/.gitconfig
      - name: Test solution
        shell: bash
        run: |
          set +e
          dotnet test CSharpGit.slnx --configuration Release 2>&1 | tee ci-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > ci-status.txt
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recent-metadata-ci
          path: |
            ci-output.txt
            ci-status.txt
      - name: Fail on test error
        shell: bash
        run: test "$(cat ci-status.txt)" = "0"
