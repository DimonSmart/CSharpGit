name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare Git test environment
        shell: pwsh
        run: |
          New-Item -ItemType File -Force (Join-Path $HOME ".gitconfig") | Out-Null
          git config --global core.autocrlf false
          if ($IsWindows) {
            # Git loose objects can otherwise carry the Windows read-only attribute,
            # which makes test fixture cleanup fail after otherwise successful tests.
            git config --global core.sharedRepository all
          }
          if ($IsMacOS) {
            # /var is a symlink to /private/var on macOS. Use a canonical temp root
            # so path assertions agree with paths returned by git rev-parse.
            "TMPDIR=/private/tmp/" >> $env:GITHUB_ENV
          }

      - name: Restore
        run: dotnet restore CSharpGit.slnx --property:Configuration=Release

      - name: Build
        run: dotnet build CSharpGit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CSharpGit.slnx --configuration Release --no-build --verbosity minimal
