name: One-time grep NUL parser fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-grep-nul-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make git grep parsing path-safe
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/CSharpGit.Git/GitRepositorySnapshotService.cs")
          text = path.read_text(encoding="utf-8")
          start_marker = "    internal static IReadOnlyList<RepositoryContentSearchMatch> ParseContentSearch("
          end_marker = "\n    private static RepositorySnapshotEntryKind EntryKind"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    internal static IReadOnlyList<RepositoryContentSearchMatch> ParseContentSearch(
              string output,
              string commitHash)
          {
              if (string.IsNullOrEmpty(output)) return [];

              var matches = new List<RepositoryContentSearchMatch>();
              var revisionPrefix = commitHash + ":";
              var cursor = 0;
              while (cursor < output.Length)
              {
                  var fileEnd = output.IndexOf('\\0', cursor);
                  if (fileEnd <= cursor)
                      throw new FormatException("Git grep returned an invalid NUL-delimited filename.");

                  var revisionAndPath = output[cursor..fileEnd];
                  var path = revisionAndPath.StartsWith(revisionPrefix, StringComparison.Ordinal)
                      ? revisionAndPath[revisionPrefix.Length..]
                      : revisionAndPath;
                  cursor = fileEnd + 1;

                  var lineNumberEnd = output.IndexOf('\\0', cursor);
                  if (lineNumberEnd <= cursor || !int.TryParse(output[cursor..lineNumberEnd], out var lineNumber))
                      throw new FormatException("Git grep returned an invalid line number.");
                  cursor = lineNumberEnd + 1;

                  var snippetEnd = output.IndexOf('\\n', cursor);
                  if (snippetEnd < 0) snippetEnd = output.Length;
                  var snippet = output[cursor..snippetEnd].TrimEnd('\\r');
                  matches.Add(new RepositoryContentSearchMatch(path, lineNumber, snippet));
                  cursor = snippetEnd < output.Length ? snippetEnd + 1 : output.Length;
              }

              return matches;
          }
'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="\n")
          Path('.github/workflows/one-time-grep-nul-parser.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Parse historical content search without newline-splitting paths"
          git push origin HEAD:main
