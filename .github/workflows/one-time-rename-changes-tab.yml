name: One-time Changes tab rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-rename-changes-tab.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply semantic Changes tab rename
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/CSharpGit.Presentation/MainPage.xaml": [
                  ('<PivotItem x:Name="FilesTab" Header="Changes">', '<PivotItem x:Name="ChangesTab" Header="Changes">', 1),
              ],
              "src/CSharpGit.Presentation/MainPage.xaml.cs": [
                  ('FilesTab.Header = files.Count == 0 ? "Changes" : $"Changes ({files.Count})";', 'ChangesTab.Header = files.Count == 0 ? "Changes" : $"Changes ({files.Count})";', 1),
                  ('DetailsTabs.SelectedIndex = 2;', 'DetailsTabs.SelectedItem = ChangesTab;', 2),
              ],
              "src/CSharpGit.Presentation/MainPage.RepositoryFiles.cs": [
                  ('_changesTab = FilesTab;', '_changesTab = ChangesTab;', 1),
              ],
              "tests/CSharpGit.Application.Tests/HistoryDiffUiContractTests.cs": [
                  ('<PivotItem x:Name=\\"FilesTab\\" Header=\\"Changes\\">', '<PivotItem x:Name=\\"ChangesTab\\" Header=\\"Changes\\">', 1),
              ],
          }

          for file_name, edits in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new, expected in edits:
                  actual = text.count(old)
                  if actual != expected:
                      raise SystemExit(f"{file_name}: expected {expected} occurrences of {old!r}, found {actual}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          Path('.github/workflows/one-time-rename-changes-tab.yml').unlink()
      - name: Commit rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Changes tab control unambiguously"
          git push origin HEAD:main
