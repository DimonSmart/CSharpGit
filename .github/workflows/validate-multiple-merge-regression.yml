# Temporary validation workflow; removed before merge.
name: Validate commit graph viewport lifecycle

on:
  push:
    branches:
      - test/multiple-merge-topology-regression
    paths:
      - .github/workflows/validate-multiple-merge-regression.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/multiple-merge-topology-regression
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare Git test environment
        run: touch ~/.gitconfig

      - name: Apply desktop viewport test hook
        run: python3 tools/apply_graph_viewport_hook.py

      - name: Validate diff
        run: |
          git diff --check
          git diff --check origin/main...HEAD

      - name: Run Git tests
        run: dotnet test tests/CSharpGit.Git.Tests/CSharpGit.Git.Tests.csproj --configuration Release

      - name: Run application tests
        run: dotnet test tests/CSharpGit.Application.Tests/CSharpGit.Application.Tests.csproj --configuration Release

      - name: Restore desktop application
        run: dotnet restore src/CSharpGit.Presentation/CSharpGit.Presentation.csproj

      - name: Run desktop smoke tests
        run: xvfb-run -a dotnet test tests/CSharpGit.Desktop.Tests/CSharpGit.Desktop.Tests.csproj --configuration Release

      - name: Build full solution
        run: dotnet build CSharpGit.slnx --configuration Release

      - name: Commit validated viewport hook
        run: |
          git config user.name "CSharpGit maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add src/CSharpGit.Presentation/MainPage.xaml.cs
          git commit -m "Exercise commit graph viewport recycling in desktop smoke"
          git push origin HEAD:test/multiple-merge-topology-regression
