name: Apply commit graph and history fix

on:
  push:
    branches:
      - fix/commit-graph-history-lifecycle
    paths:
      - .github/workflows/apply-history-fix.yml
      - tools/apply_history_fix.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/commit-graph-history-lifecycle

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare Git test environment
        run: touch ~/.gitconfig

      - name: Apply changes
        run: |
          python3 tools/apply_history_fix.py
          python3 -c "from pathlib import Path; p=Path('tests/CSharpGit.Git.Tests/GitReferenceHistoryTopologyRegressionTests.cs'); s=p.read_text(); s=s.replace('var qTrack = Assert.Single(first.Topology.Edges.Where(edge => edge.FromLane == first.Topology.Lane && edge.ToLane == 2)).TrackId;', 'var qTrack = Assert.Single(first.Topology.Edges, edge => edge.FromLane == first.Topology.Lane && edge.ToLane == 2).TrackId;'); p.write_text(s)"

      - name: Validate diff
        run: git diff --check

      - name: Run Git service tests
        run: dotnet test tests/CSharpGit.Git.Tests/CSharpGit.Git.Tests.csproj --configuration Release

      - name: Run application contract tests
        run: dotnet test tests/CSharpGit.Application.Tests/CSharpGit.Application.Tests.csproj --configuration Release

      - name: Run desktop smoke tests
        run: xvfb-run -a dotnet test tests/CSharpGit.Desktop.Tests/CSharpGit.Desktop.Tests.csproj --configuration Release

      - name: Build full solution
        run: dotnet build CSharpGit.slnx --configuration Release

      - name: Commit validated changes
        shell: bash
        run: |
          git rm .github/workflows/apply-history-fix.yml tools/apply_history_fix.py
          git add -A
          git diff --cached --check
          git status --short
          git config user.name "CSharpGit maintenance"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix commit graph topology and history lifecycle"
          git push origin HEAD:fix/commit-graph-history-lifecycle
