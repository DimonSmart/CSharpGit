name: Implement history navigation performance v3
on:
  push:
    branches: [automation/history-navigation-performance-20260911]
    paths: [.github/workflows/history-navigation-implement-v3.yml]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply refactor
        run: |
          python3 .github/history-navigation-refactor.py
          python3 .github/history-navigation-fix1.py
          python3 .github/history-navigation-fix2.py
      - name: Verify presentation hot path
        shell: bash
        run: |
          ! grep -RInE "_viewModel\.SelectedCommit|Binding SelectedCommit\.Commit|Loading commit|ReadFileStatusesAsync" src/CSharpGit.Presentation
      - name: Prepare Git test environment
        shell: pwsh
        run: |
          New-Item -ItemType File -Force (Join-Path $HOME ".gitconfig") | Out-Null
          git config --global core.autocrlf false
      - name: Restore
        run: dotnet restore CSharpGit.slnx --property:Configuration=Release
      - name: Build
        run: dotnet build CSharpGit.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test CSharpGit.slnx --configuration Release --no-build --verbosity minimal
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/history-navigation-refactor.py .github/history-navigation-fix1.py .github/history-navigation-fix2.py
          rm -f .github/workflows/history-navigation-inventory.yml .github/workflows/history-navigation-inventory-grep.yml
          rm -f .github/workflows/history-navigation-implement.yml .github/workflows/history-navigation-implement-v2.yml .github/workflows/history-navigation-implement-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make history navigation lazy and cancellable"
          git push origin HEAD:automation/history-navigation-performance-20260911
