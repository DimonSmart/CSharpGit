name: Apply incremental repository tree patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'work/incremental-repository-tree'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply one-shot patch
        run: python tools/apply_incremental_tree_patch.py

      - name: Commit patched existing files
        shell: bash
        run: |
          git config user.name "CSharpGit automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finish incremental repository tree integration"
          git push origin HEAD:${{ github.head_ref }}
