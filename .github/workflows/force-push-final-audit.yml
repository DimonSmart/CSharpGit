name: Final Force Push Audit

on:
  push:
    branches: [main]
    paths:
      - .github/force-push-final-audit.py
      - .github/workflows/force-push-final-audit.yml

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.204'
      - name: Prepare Git test environment
        run: |
          git config --global user.name "CSharpGit CI"
          git config --global user.email "ci@example.invalid"
      - name: Apply final audit patch
        run: python .github/force-push-final-audit.py
      - name: Fix retry-test analyzer assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/CSharpGit.Git.Tests/ForcePushWithLeaseRetryTests.cs")
          text = path.read_text(encoding="utf-8")
          old = "        Assert.Equal(1, File.ReadAllLines(_pushLog).Length);"
          new = "        Assert.Single(File.ReadAllLines(_pushLog));"
          if text.count(old) != 1:
              raise RuntimeError(f"expected one assertion to fix, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Check diff
        run: git diff --check
      - name: Build desktop solution
        run: dotnet build CSharpGit.slnx -c Release
      - name: Run full test suite
        if: runner.os == 'Linux'
        run: dotnet test CSharpGit.slnx -c Release --no-build

  commit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Ensure main has not moved
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Apply verified patch
        run: python .github/force-push-final-audit.py
      - name: Fix retry-test analyzer assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/CSharpGit.Git.Tests/ForcePushWithLeaseRetryTests.cs")
          text = path.read_text(encoding="utf-8")
          old = "        Assert.Equal(1, File.ReadAllLines(_pushLog).Length);"
          new = "        Assert.Single(File.ReadAllLines(_pushLog));"
          if text.count(old) != 1:
              raise RuntimeError(f"expected one assertion to fix, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Remove temporary audit files
        run: rm .github/force-push-final-audit.py .github/workflows/force-push-final-audit.yml
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete force push safety guards"
          git push origin HEAD:main
