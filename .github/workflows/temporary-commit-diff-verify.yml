name: Temporary commit diff verification

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Initialize Git user configuration
        run: |
          git config --global user.email "csharpgit-ci@example.invalid"
          git config --global user.name "CSharpGit CI"
      - name: Build desktop application
        run: dotnet build src/CSharpGit.Presentation/CSharpGit.Presentation.csproj --configuration Release
      - name: Test application contracts
        run: dotnet test tests/CSharpGit.Application.Tests/CSharpGit.Application.Tests.csproj --configuration Release
      - name: Test Git integration
        run: dotnet test tests/CSharpGit.Git.Tests/CSharpGit.Git.Tests.csproj --configuration Release
      - name: Test desktop suite
        run: dotnet test tests/CSharpGit.Desktop.Tests/CSharpGit.Desktop.Tests.csproj --configuration Release
