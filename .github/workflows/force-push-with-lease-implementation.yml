name: Implement Force Push With Lease

on:
  push:
    branches: [main]
    paths:
      - .github/force-push-with-lease-implementation.py.gz.b64
      - .github/workflows/force-push-with-lease-implementation.yml

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.204'
      - name: Decode and patch implementation
        shell: python
        run: |
          import base64, gzip, pathlib
          source = pathlib.Path(".github/force-push-with-lease-implementation.py.gz.b64")
          target = pathlib.Path(".github/force-push-with-lease-implementation.py")
          text = gzip.decompress(base64.b64decode(source.read_text(encoding="ascii"))).decode("utf-8")
          text = text.replace(
              "        catch (ForcePushWithLeasePreparationException\n"
              "               { Failure: ForcePushPreparationFailure.MissingUpstream })\n",
              "        catch (ForcePushWithLeasePreparationException exception)\n"
              "            when (exception.Failure == ForcePushPreparationFailure.MissingUpstream)\n",
              1)
          target.write_text(text, encoding="utf-8")
      - name: Prepare Git test environment
        run: |
          git config --global user.name "CSharpGit CI"
          git config --global user.email "ci@example.invalid"
      - name: Apply implementation
        run: python .github/force-push-with-lease-implementation.py
      - name: Update existing push failure contract test
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/CSharpGit.Git.Tests/GitCliRepositoryServiceTests.cs")
          text = path.read_text(encoding="utf-8")
          old = "var authenticationFailure = await Assert.ThrowsAsync<CSharpGit.Application.Exceptions.RepositoryOpenException>("
          new = "var authenticationFailure = await Assert.ThrowsAsync<CSharpGit.Application.Exceptions.PushRejectedException>("
          if text.count(old) != 1:
              raise RuntimeError(f"expected one legacy push assertion, found {text.count(old)}")
          text = text.replace(old, new, 1)
          marker = '        Assert.Contains("Authentication failed", authenticationFailure.Message, StringComparison.OrdinalIgnoreCase);\n'
          replacement = marker + '        Assert.Equal(CSharpGit.Application.Exceptions.PushResultKind.AuthenticationOrTransportFailure, authenticationFailure.ResultKind);\n'
          if text.count(marker) != 1:
              raise RuntimeError(f"expected one authentication assertion, found {text.count(marker)}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
      - name: Check diff
        run: git diff --check
      - name: Build desktop solution
        run: dotnet build CSharpGit.slnx -c Release
      - name: Run tests
        if: runner.os == 'Linux'
        run: dotnet test CSharpGit.slnx -c Release --no-build

  commit:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Decode and patch implementation
        shell: python
        run: |
          import base64, gzip, pathlib
          source = pathlib.Path(".github/force-push-with-lease-implementation.py.gz.b64")
          target = pathlib.Path(".github/force-push-with-lease-implementation.py")
          text = gzip.decompress(base64.b64decode(source.read_text(encoding="ascii"))).decode("utf-8")
          text = text.replace(
              "        catch (ForcePushWithLeasePreparationException\n"
              "               { Failure: ForcePushPreparationFailure.MissingUpstream })\n",
              "        catch (ForcePushWithLeasePreparationException exception)\n"
              "            when (exception.Failure == ForcePushPreparationFailure.MissingUpstream)\n",
              1)
          target.write_text(text, encoding="utf-8")
      - name: Apply verified implementation
        run: python .github/force-push-with-lease-implementation.py
      - name: Update existing push failure contract test
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/CSharpGit.Git.Tests/GitCliRepositoryServiceTests.cs")
          text = path.read_text(encoding="utf-8")
          old = "var authenticationFailure = await Assert.ThrowsAsync<CSharpGit.Application.Exceptions.RepositoryOpenException>("
          new = "var authenticationFailure = await Assert.ThrowsAsync<CSharpGit.Application.Exceptions.PushRejectedException>("
          if text.count(old) != 1:
              raise RuntimeError(f"expected one legacy push assertion, found {text.count(old)}")
          text = text.replace(old, new, 1)
          marker = '        Assert.Contains("Authentication failed", authenticationFailure.Message, StringComparison.OrdinalIgnoreCase);\n'
          replacement = marker + '        Assert.Equal(CSharpGit.Application.Exceptions.PushResultKind.AuthenticationOrTransportFailure, authenticationFailure.ResultKind);\n'
          if text.count(marker) != 1:
              raise RuntimeError(f"expected one authentication assertion, found {text.count(marker)}")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
      - name: Remove temporary implementation workflow
        run: rm .github/force-push-with-lease-implementation.py .github/force-push-with-lease-implementation.py.gz.b64 .github/workflows/force-push-with-lease-implementation.yml
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add safe force push with lease"
          git push origin HEAD:main
