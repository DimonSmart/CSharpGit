name: Implement selected commit actions

on:
  push:
    branches:
      - idd-0014-selected-commit-actions
    paths:
      - .github/workflows/implement-selected-commit-actions.yml
      - tools/apply_selected_commit_actions.py
      - tools/fix_commit_action_labels.py

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Initialize Git global config
        run: touch "$HOME/.gitconfig"
      - name: Apply implementation patch
        run: |
          python3 tools/apply_selected_commit_actions.py
          python3 tools/fix_commit_action_labels.py
      - name: Verify Git integration tests
        run: dotnet test tests/CSharpGit.Git.Tests/CSharpGit.Git.Tests.csproj --configuration Release
      - name: Verify application contract tests
        run: dotnet test tests/CSharpGit.Application.Tests/CSharpGit.Application.Tests.csproj --configuration Release
      - name: Build presentation
        run: dotnet build src/CSharpGit.Presentation/CSharpGit.Presentation.csproj --configuration Release
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement selected commit actions and stable refresh"
          git push origin HEAD:idd-0014-selected-commit-actions
