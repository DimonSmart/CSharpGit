name: Validate graph log flush

on:
  push:
    branches:
      - fix/graph-log-flush
    paths:
      - .github/workflows/validate-graph-log-flush.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graph-log-flush
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare Git test environment
        run: touch ~/.gitconfig
      - name: Validate diff
        run: git diff --check origin/main...HEAD
      - name: Run Git tests
        run: dotnet test tests/CSharpGit.Git.Tests/CSharpGit.Git.Tests.csproj --configuration Release
      - name: Run application tests
        run: dotnet test tests/CSharpGit.Application.Tests/CSharpGit.Application.Tests.csproj --configuration Release
      - name: Restore desktop application
        run: dotnet restore src/CSharpGit.Presentation/CSharpGit.Presentation.csproj
      - name: Run desktop tests
        run: xvfb-run -a dotnet test tests/CSharpGit.Desktop.Tests/CSharpGit.Desktop.Tests.csproj --configuration Release
      - name: Verify session log is written immediately
        shell: bash
        run: |
          TEST_REPO="$RUNNER_TEMP/csharpgit-log-repo"
          LOG_HOME="$RUNNER_TEMP/csharpgit-log-home"
          mkdir -p "$TEST_REPO" "$LOG_HOME"
          touch "$LOG_HOME/.gitconfig"
          git -C "$TEST_REPO" init -b main
          git -C "$TEST_REPO" config user.name "Graph Log Check"
          git -C "$TEST_REPO" config user.email "graph-log@example.invalid"
          printf 'root\n' > "$TEST_REPO/root.txt"
          git -C "$TEST_REPO" add root.txt
          git -C "$TEST_REPO" commit -m "Graph log fixture"

          HOME="$LOG_HOME" \
          XDG_DATA_HOME="$LOG_HOME/.local/share" \
          CSHARPGIT_CLOSE_CHECK=1 \
          CSHARPGIT_UI_CHECK_REPOSITORY="$TEST_REPO" \
          xvfb-run -a src/CSharpGit.Presentation/bin/Release/net10.0-desktop/CSharpGit.Presentation

          log=$(find "$LOG_HOME" -type f -name 'csharpgit-*.log' -size +0c | head -n 1)
          test -n "$log"
          grep -q 'FileLoggerStarted' "$log"
          grep -q 'DiagnosticsInitialized' "$log"
          grep -q 'CSharpGit.CommitGraph' "$log"
          echo "Verified non-empty graph log: $log"
          wc -c "$log"
      - name: Build solution
        run: dotnet build CSharpGit.slnx --configuration Release
